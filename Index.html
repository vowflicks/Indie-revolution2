setForm(f => {

if (f.genres.length >= 3) return f;
return { ...f, genres: [...f.genres, g] };
});
};

if (form.honeypot) return true;
if (Date.now() - formStartTime.current < 4000) return true;
if (!form.favoriteFilm.trim()) return true;
return false;
};

const isBotInvolved = () => {
if (involvedForm.honeypot) return true;
if (Date.now() - formStartTime.current < 4000) return true;
if (!involvedForm.favoriteFilm.trim()) return true;
return false;
};

if (!form.name || !form.email || !form.city || !form.state || !oathTaken) return;

if (spotsLeft > 0) setSpotsLeft(s => s - 1);
setStep(“success”);
};

if (filmForm.name && filmForm.email && filmForm.film) setStep(“success”);
};

if (!involvedForm.name || !involvedForm.email || !involvedForm.skill || !involvedForm.idea) {

};

};

            </p>
          </div>

          <p style={{ fontSize:"17px", lineHeight:1.9, color:"rgba(240,235,224,0.65)" }}>The Renegades don't follow trends. They set them. Not in boardrooms or pitch meetings — in parking lots after midnight, in church halls full of strangers who became friends, in warehouses where the projector flickered and nobody cared because the story was that good.</p>

          {/* Roadmap in manifesto */}

                  </div>
                  <div style={{ borderLeft:`2px solid ${status==="NOW"?"#c0392b":"rgba(240,235,224,0.1)"}`, paddingLeft:"24px", flex:1 }}>
                    <p style={{ fontSize:"16px", color: status==="NOW"?"#f0ebe0":"rgba(240,235,224,0.4)", marginBottom:"8px" }}>{title}</p>
                    <p style={{ fontSize:"14px", lineHeight:1.7, color: status==="NOW"?"rgba(240,235,224,0.6)":"rgba(240,235,224,0.25)", margin:0 }}>{desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <p style={{ fontSize:"28px", color:"#c0392b", letterSpacing:"0.05em" }}>That's the revolution.<br />Join it. ✊</p>
        </div>
        <div style={{ width:"48px", height:"2px", background:"rgba(192,57,43,0.3)", margin:"64px 0 48px" }} />
        <div style={{ display:"flex", gap:"16px", flexWrap:"wrap" }}>
          <button onClick={() => { setStep("signup"); setRole("fan"); }} style={rBtn}>Become a Renegade →</button>
          <button onClick={() => { setStep("signup"); setRole("filmmaker"); }} style={gBtn}>I Have a Film</button>
        </div>
      </div>
    )}

    {/* ───── SUCCESS ───── */}
    {step === "success" && (
      <div style={{ maxWidth:"560px", margin:"0 auto", padding:"120px 48px", textAlign:"center" }}>
        <div style={{ fontSize:"56px", marginBottom:"32px" }}>✊</div>
        {role !== "filmmaker" && spotsLeft < TOTAL_FOUNDING && (
          <div style={{ background:"rgba(192,57,43,0.08)", border:"1px solid rgba(192,57,43,0.3)", padding:"20px", marginBottom:"32px" }}>
            <p style={{ fontSize:"11px", letterSpacing:"0.3em", textTransform:"uppercase", color:"#c0392b", margin:"0 0 8px" }}>🏆 You're a Founding Renegade</p>
            <p style={{ fontSize:"14px", color:"rgba(240,235,224,0.6)", margin:0 }}>Your Founding Trophy is reserved. There are {spotsLeft} spots remaining. It will never be made again.</p>
          </div>
        )}
        <p style={{ fontSize:"11px", letterSpacing:"0.4em", textTransform:"uppercase", color:"#c0392b", marginBottom:"24px" }}>
          {role==="filmmaker" ? "You're in the revolution" : "Welcome, Renegade"}
        </p>
        <h2 style={{ fontSize:"40px", fontWeight:"normal", marginBottom:"24px" }}>
          {role==="filmmaker" ? "Film listed. Revolution incoming." : "You're a Renegade now."}
        </h2>
        <p style={{ fontSize:"16px", lineHeight:1.8, color:"rgba(240,235,224,0.55)", marginBottom:"16px" }}>
          {role==="filmmaker"
            ? "We'll match your tour towns to Renegades and venues within 48 hours."
            : `The moment an indie film is heading to ${form.city||"your town"}, you'll be the first Renegade to know.`}
        </p>
        <p style={{ fontSize:"18px", color:"#c0392b", letterSpacing:"0.2em", textTransform:"uppercase", marginBottom:"48px" }}>Lights. Camera. Action.</p>
        <button onClick={() => { setStep("home"); setForm({name:"",email:"",city:"",state:"",genres:[],favoriteFilm:"",honeypot:""}); setFilmForm({name:"",email:"",film:"",year:"",synopsis:"",towns:"",budget:""}); setOathTaken(false); }} style={{ padding:"14px 36px", background:"transparent", border:"1px solid rgba(192,57,43,0.5)", color:"#c0392b", fontSize:"12px", letterSpacing:"0.2em", textTransform:"uppercase", cursor:"pointer", fontFamily:"inherit" }}>
          ← Back to Indie Revolutions
        </button>
      </div>
    )}

  </div>
</div>

);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<IndieRevolution />);

  </script>
</body>
</html>
